name: release

on:
  push:
    tags: [ 'v*' ]

jobs:
  publish-central:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # Maven Central 发布凭据（仓库 Settings -> Secrets 配置）：
          #   CENTRAL_USERNAME / CENTRAL_PASSWORD  = central.sonatype.com 的 User Token
          #   GPG_PRIVATE_KEY                      = 导出的私钥（armored）
          #   GPG_PASSPHRASE                       = GPG 密钥口令
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Build & test & integration-test
        run: mvn -B -ntp verify
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish GPG public key to keyserver
        # Central 校验签名需要公钥在公共 keyserver 上（幂等，可重复执行）
        run: |
          FP=$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1=="fpr"{print $10; exit}')
          echo "sending public key ${FP} to keyserver.ubuntu.com"
          gpg --batch --keyserver keyserver.ubuntu.com --send-keys "$FP"

      - name: Publish to Maven Central Portal
        run: mvn -B -ntp deploy -Prelease -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
