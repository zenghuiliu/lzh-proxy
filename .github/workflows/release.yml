name: release

on:
  push:
    tags: [ 'v*' ]

jobs:
  publish-central:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 手动写入 Maven Central 凭据（setup-java 可能写成 ${env.XXX} 引用，
      # 而插件解析不到环境变量导致 401；直接写死值最可靠）
      - name: Configure Maven Central credentials
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${CENTRAL_USERNAME}</username>
                <password>${CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          gpg --batch --import <<< "$GPG_PRIVATE_KEY"
          mkdir -p ~/.gnupg
          printf "allow-loopback-pinentry\n" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true

      - name: Build & test & integration-test
        run: mvn -B -ntp verify
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish GPG public key to keyserver
        # Central 校验签名需要公钥在公共 keyserver 上（幂等，可重复执行）
        run: |
          FP=$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1=="fpr"{print $10; exit}')
          echo "sending public key ${FP} to keyserver.ubuntu.com"
          gpg --batch --keyserver keyserver.ubuntu.com --send-keys "$FP"

      - name: Publish to Maven Central Portal
        run: mvn -B -ntp deploy -Prelease -DskipTests
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
