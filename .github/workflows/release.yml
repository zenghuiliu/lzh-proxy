name: release

on:
  push:
    tags: [ 'v*' ]

jobs:
  publish-central:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-java 只负责 JDK 与 Central 部署凭据；
      # GPG 手动导入（避免 setup-java 把 gpg.passphrase 写入 settings.xml 引发解密报错）
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: ${{ secrets.CENTRAL_USERNAME }}
          server-password: ${{ secrets.CENTRAL_PASSWORD }}

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          gpg --batch --import <<< "$GPG_PRIVATE_KEY"
          mkdir -p ~/.gnupg
          printf "allow-loopback-pinentry\n" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true

      - name: Build & test & integration-test
        run: mvn -B -ntp verify
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish GPG public key to keyserver
        # Central 校验签名需要公钥在公共 keyserver 上（幂等，可重复执行）
        run: |
          FP=$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1=="fpr"{print $10; exit}')
          echo "sending public key ${FP} to keyserver.ubuntu.com"
          gpg --batch --keyserver keyserver.ubuntu.com --send-keys "$FP"

      - name: Publish to Maven Central Portal
        run: mvn -B -ntp deploy -Prelease -DskipTests
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
