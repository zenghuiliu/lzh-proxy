name: build

on:
  push:
    branches: [ master, 'refactor/**' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & test & integration-test
        run: mvn -B -ntp verify
